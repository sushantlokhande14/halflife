[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halflife"
version = "0.1.0"
description = "Measures how fast public information is priced in, and models what is left of the move."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "lxml>=5",
    "beautifulsoup4>=4.12",
    "tzdata",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
halflife = "halflife.cli:main"

[tool.setuptools.packages.find]
include = ["halflife*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
